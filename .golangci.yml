# Configuration is available here https://golangci-lint.run/usage/configuration/
linters:
  disable-all: true
  enable:
  - bodyclose
  - contextcheck
  - dupl
  - dupword
  - durationcheck
  - err113
  - errcheck
  - errchkjson
  - errname
  - exhaustruct
  - funlen
  - gocheckcompilerdirectives
  - gochecknoglobals
  - gochecknoinits
  - gocognit
  - goconst
  - godot
  - godox
  - gofmt
  - goimports
  - goprintffuncname
  - gosec
  - gosimple
  - govet
  - iface
  - inamedparam
  - ineffassign
  - interfacebloat
  - intrange
  - ireturn
  - lll
  - loggercheck
  - makezero
  - misspell
  - mnd
  - musttag
  - nestif
  - nilerr
  - nilnesserr
  - nilnil
  - nlreturn
  - noctx
  - nolintlint
  - nonamedreturns
  - nosprintfhostport
  - perfsprint
  - staticcheck
  - revive
  - tagalign
  - tagliatelle
  - typecheck
  - testifylint
  - testpackage
  - unconvert
  - unparam
  - unused
  - wastedassign
  - whitespace
  - wsl

linters-settings:
  nlreturn:
    block-size: 4
  wsl:
    allow-assign-and-call: true
    force-case-trailing-whitespace: 4

run:
  timeout: 1m

issues:
  exclude-dirs:
    - build
    - docs
    - tmp
  exclude-rules:
    - path: _test\.go
      linters:
        - gochecknoglobals
