version: '3'

tasks:

  install-air:
    desc: installs air dependencies
    cmds:
      - go install github.com/air-verse/air@latest

  dev:
    deps: [install-air]
    desc: starts server in development mode.
    dir: '{{.USER_WORKING_DIR}}'
    cmd: air

  build:
    desc: build server in production mode.
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - go build -o build/main cmd/main.go
      - ./build/main

  build-docker:
    desc: build server in production mode inside docker.
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - docker build -t go-framework .
      - docker run -p 3000:3000 go-framework

  build-docker-compose:
    desc: build server in production mode inside docker with docker compose.
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - docker compose up --build
